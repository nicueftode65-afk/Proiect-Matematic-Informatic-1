<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Proiect Matematică & Informatică</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:linear-gradient(135deg,#1e1e2f,#2b2b4f);
    color:white;
}
header{
    text-align:center;
    padding:30px;
    background:rgba(0,0,0,0.3);
}
section{
    max-width:1000px;
    margin:30px auto;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:25px;
}
h2{color:#ffd369}
.flex{display:flex;flex-wrap:wrap;gap:20px}

.card{
    flex:1;
    min-width:300px;
    background:rgba(0,0,0,0.3);
    border-radius:15px;
    padding:15px;
    transition:transform 0.25s ease;
}
.card:hover{transform:scale(1.05)}

input{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

canvas{
    background:#fff;
    border-radius:15px;
    border:4px solid #fff;
}

.rezultat{
    margin-top:10px;
    font-size:15px;
    line-height:1.5;
    color:#ffd369;
}
</style>
</head>

<body>

<header>
<h1>📐 Proiect Matematică & Informatică</h1>
<p>Arhitect Digital • Codul Poligoanelor • Simulator Economii</p>
</header>

<!-- CAMERA -->
<section>
<h2>🏠 Arhitectul Digital</h2>
<div class="flex">
<div class="card">
<p>Lungime: <input id="l" type="number" value="5"></p>
<p>Lățime: <input id="w" type="number" value="4"></p>
<p>Înălțime: <input id="h" type="number" value="3"></p>
<div id="rezCamera" class="rezultat"></div>
</div>
<div class="card">
<canvas id="cam" width="360" height="240"></canvas>
</div>
</div>
</section>

<!-- POLIGON -->
<section>
<h2>🔷 Codul Poligoanelor</h2>
<div class="flex">
<div class="card">
<p>Număr laturi (n): <input id="n" type="number" value="5"></p>
<p>Lungime latură (a): <input id="a" type="number" value="50"></p>
<div id="rezPoly" class="rezultat"></div>
</div>
<div class="card">
<canvas id="poly" width="300" height="300"></canvas>
</div>
</div>
</section>

<!-- ECONOMII -->
<section>
<h2>💰 Simulator Economii</h2>
<div class="flex">
<div class="card">
<p>Suma inițială: <input id="suma" type="number" value="1000"></p>
<p>Dobândă (%): <input id="dob" type="number" value="5"></p>
<div id="rezEco" class="rezultat"></div>
</div>
<div class="card">
<canvas id="eco" width="360" height="240"></canvas>
</div>
</div>
</section>

<script>
const l=document.getElementById("l");
const w=document.getElementById("w");
const h=document.getElementById("h");
const n=document.getElementById("n");
const a=document.getElementById("a");
const suma=document.getElementById("suma");
const dob=document.getElementById("dob");

const cam=document.getElementById("cam").getContext("2d");
const poly=document.getElementById("poly").getContext("2d");
const eco=document.getElementById("eco").getContext("2d");

/* CAMERA */
function updateCamera(){
    const L=+l.value,W=+w.value,H=+h.value;
    const aria=2*H*(L+W);
    const gresie=L*W;
    const vopsea=aria/10;

    rezCamera.innerHTML=
        `Aria pereților: ${aria.toFixed(2)} m²<br>
         Gresie: ${gresie.toFixed(2)} m²<br>
         Vopsea: ${vopsea.toFixed(2)} L`;

    cam.clearRect(0,0,360,240);
    const scale=Math.min(260/L,160/W);
    const rw=L*scale,rh=W*scale;
    const x=(360-rw)/2,y=(240-rh)/2;

    cam.fillStyle="#ffd369";
    cam.fillRect(x,y,rw,rh);
    cam.lineWidth=4;
    cam.strokeRect(x,y,rw,rh);

    cam.fillStyle="#000";
    cam.font="bold 14px Arial";
    cam.fillText(`L=${L}m`,x+rw/2-25,y-8);
    cam.fillText(`l=${W}m`,x-45,y+rh/2);
    cam.fillText(`h=${H}m`,x+rw+5,y+rh/2);
}

/* POLIGON */
function updatePolygon(){
    const N=Math.max(3,+n.value);
    const A=+a.value;
    const P=N*A;
    const area=(N*A*A)/(4*Math.tan(Math.PI/N));

    rezPoly.innerHTML=
        `Perimetru: ${P.toFixed(2)}<br>
         Arie: ${area.toFixed(2)}`;

    poly.clearRect(0,0,300,300);
    poly.beginPath();
    for(let i=0;i<N;i++){
        const ang=2*Math.PI*i/N-Math.PI/2;
        const x=150+100*Math.cos(ang);
        const y=150+100*Math.sin(ang);
        i?poly.lineTo(x,y):poly.moveTo(x,y);
    }
    poly.closePath();
    poly.lineWidth=5;
    poly.strokeStyle="#ff4500";
    poly.stroke();
}

/* ECONOMII */
function updateEco(){
    const S=+suma.value;
    const d=+dob.value/100;
    let values=[];
    for(let i=0;i<=5;i++) values.push(S*Math.pow(1+d,i));

    rezEco.innerHTML="";
    values.forEach((v,i)=>{
        rezEco.innerHTML+=`An ${i}: ${v.toFixed(2)} lei<br>`;
    });

    eco.clearRect(0,0,360,240);
    const max=Math.max(...values);
    const scale=140/max;

    let px=40,py=200;
    eco.lineWidth=5;
    eco.strokeStyle="#1e90ff";
    eco.fillStyle="#000";
    eco.font="bold 12px Arial";

    values.forEach((v,i)=>{
        const x=40+i*55;
        const y=200-v*scale;

        if(i>0){
            eco.beginPath();
            eco.moveTo(px,py);
            eco.lineTo(x,y);
            eco.stroke();
        }

        eco.beginPath();
        eco.arc(x,y,5,0,Math.PI*2);
        eco.fill();

        eco.fillText(v.toFixed(0)+" lei",x-25,y-10);
        eco.fillText("An "+i,x-12,220);

        px=x; py=y;
    });
}

[l,w,h].forEach(e=>e.addEventListener("input",updateCamera));
[n,a].forEach(e=>e.addEventListener("input",updatePolygon));
[suma,dob].forEach(e=>e.addEventListener("input",updateEco));

updateCamera();
updatePolygon();
updateEco();
</script>

</body>
</html>
