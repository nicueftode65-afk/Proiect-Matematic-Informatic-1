<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Proiect Matematică & Informatică</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #1e1e2f, #2b2b4f);
    color: white;
}

header {
    text-align: center;
    padding: 30px;
    background: rgba(0,0,0,0.3);
}

section {
    max-width: 1000px;
    margin: 30px auto;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 25px;
}

h2 {
    color: #ffd369;
}

input, button {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    background: #ffd369;
    cursor: pointer;
}

button:hover {
    background: #ffbf00;
}

.flex {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    flex: 1;
    min-width: 280px;
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    padding: 15px;
}

canvas {
    background: white;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>📐 Proiect Matematică & Informatică</h1>
    <p>Geometrie • Algoritmi • Economii</p>
</header>

<!-- CAMERA -->
<section>
<h2>🏠 Arhitectul Digital</h2>

<div class="flex">
<div class="card">
    <p>Lungime (m): <input id="l" type="number"></p>
    <p>Lățime (m): <input id="w" type="number"></p>
    <p>Înălțime (m): <input id="h" type="number"></p>
    <button onclick="calcCamera()">Calculează</button>
    <p id="rezCamera"></p>
</div>

<div class="card">
    <canvas id="cameraCanvas" width="250" height="200"></canvas>
</div>
</div>
</section>

<!-- POLIGON -->
<section>
<h2>🔷 Codul Poligoanelor</h2>

<div class="flex">
<div class="card">
    <p>Număr laturi (n): <input id="n" type="number"></p>
    <p>Lungime latură: <input id="a" type="number"></p>
    <button onclick="drawPolygon()">Desenează</button>
    <p id="rezPoly"></p>
</div>

<div class="card">
    <canvas id="polyCanvas" width="250" height="250"></canvas>
</div>
</div>
</section>

<!-- ECONOMII -->
<section>
<h2>💰 Simulator de Economii</h2>

<div class="flex">
<div class="card">
    <p>Suma inițială: <input id="suma" type="number"></p>
    <p>Dobândă anuală (%): <input id="dob" type="number"></p>
    <button onclick="calcEconomie()">Simulează</button>
</div>

<div class="card">
    <canvas id="ecoCanvas" width="300" height="200"></canvas>
</div>
</div>
</section>

<script>
/* CAMERA */
function calcCamera() {
    let l = +l.value, w = +w.value, h = +h.value;
    let aria = 2*h*(l+w);
    let vopsea = aria / 10; // 10 m² / litru

    rezCamera.innerHTML =
        `Aria pereților: ${aria.toFixed(2)} m²<br>
         Vopsea necesară: ${vopsea.toFixed(2)} L`;

    let c = cameraCanvas.getContext("2d");
    c.clearRect(0,0,250,200);
    c.strokeRect(40,40,170,100);
}

/* POLIGON */
function drawPolygon() {
    let n = +document.getElementById("n").value;
    let a = +document.getElementById("a").value;
    let P = n * a;
    let A = (n * a * a) / (4 * Math.tan(Math.PI/n));

    rezPoly.innerHTML =
        `Perimetru: ${P.toFixed(2)}<br>
         Arie: ${A.toFixed(2)}`;

    let ctx = polyCanvas.getContext("2d");
    ctx.clearRect(0,0,250,250);
    ctx.beginPath();

    let R = 90;
    let cx = 125, cy = 125;

    for(let i=0;i<n;i++){
        let angle = 2*Math.PI*i/n;
        let x = cx + R*Math.cos(angle);
        let y = cy + R*Math.sin(angle);
        i==0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
}

/* ECONOMII */
function calcEconomie() {
    let suma = +document.getElementById("suma").value;
    let dob = +document.getElementById("dob").value / 100;

    let ctx = ecoCanvas.getContext("2d");
    ctx.clearRect(0,0,300,200);

    let values = [];
    for(let i=0;i<=5;i++){
        values.push(suma * Math.pow(1+dob, i));
    }

    ctx.beginPath();
    ctx.moveTo(20,180-values[0]/50);

    for(let i=1;i<values.length;i++){
        ctx.lineTo(20+i*50,180-values[i]/50);
    }
    ctx.stroke();
}
</script>

</body>
</html>
